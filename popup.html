<!DOCTYPE html>
<html lang="cz">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 100%;
            padding: 10px;
            font-family: sans-serif;
            font-size: 6vw;
        }


        button {
            width: 100%;
            height: 10vh;
            padding: 10px;
            cursor: pointer;
            background: #1877F2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 4vw;
        }

        .input-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="number"] {
            height: 5vh;
            width: 80%;
            font-size: 4vw;
        }

        input[type="range"] {
            width: 100%;
        }

        .stats {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h3>FB Pozvání</h3>
    <div class="input-group">
        <label for="string">Text pro vyhledání tlačítka</label>
        <input type="text" name="string" id="string" value="Pozvat">
    </div>
    <div class="input-group">
        <label for="delay">Prodleva (sekundy): <span id="delayValue">0.5</span></label>
        <input type="range" id="delay" min="0.5" max="10" value="0.5" step="0.5">
    </div>
    <div class="input-group">
        <label for="limit">Maximální počet pozvánek</label>
        <input type="number" id="limit" value="1000">
    </div>
    <div class="input-group">
        <label for="pauseAfter">Pauza po X pozvánkách</label>
        <input type="number" id="pauseAfter" value="200">
    </div>
    <div style="display:flex; gap:8px;">
        <button id="startBtn">Spustit</button>
        <button id="stopBtn" disabled>Zastavit</button>
    </div>
    <div class="stats">
        <p id="status"></p>
        <p>Pozváno: <span id="invitedCount">0</span></p>
    </div>
    <div id="history">
        <h4>Historie</h4>
        <ul></ul>
    </div>
    <script src="popup.js"></script>
</body>

</html>
